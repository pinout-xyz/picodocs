name: PicoDocs

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    name: Build Docs
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout PicoDocs
      uses: actions/checkout@v7

    - name: Checkout Pico SDK
      uses: actions/checkout@v7
      with:
        repository: raspberrypi/pico-sdk
        path: pico-sdk
        fetch-depth: 0

    - name: Plan Builds
      id: plan
      shell: bash
      run: |
        echo "key=$(python3 tools/build_docs.py --sdk pico-sdk --cache-key --doxygen-version)" >> "$GITHUB_OUTPUT"

    - name: Restore Built Docs
      uses: actions/cache@v6
      with:
        path: builds
        key: docs-${{ steps.plan.outputs.key }}

    - name: Build Docs
      shell: bash
      run: |
        python3 tools/build_docs.py --sdk pico-sdk --output builds --jobs 4 --keep-going --reuse --doxygen-version

    - name: Assemble Site
      shell: bash
      run: |
        python3 tools/assemble_site.py --artifacts builds site

    - name: Configure Pages
      uses: actions/configure-pages@v6

    - name: Upload Site
      uses: actions/upload-pages-artifact@v5
      with:
        path: site

  deploy:
    name: Publish Docs
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
    - name: Publish To Pages
      id: deployment
      uses: actions/deploy-pages@v5
