name: PicoDocs

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    name: Build Docs
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout PicoDocs
      uses: actions/checkout@v7

    # No arm-none-eabi-gcc: CMakeLists.txt points CMAKE_TOOLCHAIN_FILE at an empty file
    # so the SDK keeps the runner's compiler. The docs target compiles no sources,
    # and the HTML comes out byte-identical either way. apt's gcc-arm-none-eabi recommends
    # its way to 580MB of downloads and 3.1GB unpacked.
    - name: Install Doxygen
      run: |
        sudo apt update && sudo apt install -y --no-install-recommends doxygen

    - name: Checkout Pico SDK
      uses: actions/checkout@v7
      with:
        repository: raspberrypi/pico-sdk
        path: pico-sdk
        fetch-depth: 0

    - name: Build Docs
      shell: bash
      run: |
        python3 tools/build_docs.py --sdk pico-sdk --output builds --jobs 4 --keep-going

    - name: Assemble Site
      shell: bash
      run: |
        python3 tools/assemble_site.py --artifacts builds site

    - name: Configure Pages
      uses: actions/configure-pages@v6

    - name: Upload Site
      uses: actions/upload-pages-artifact@v5
      with:
        path: site

  deploy:
    name: Publish Docs
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
    - name: Publish To Pages
      id: deployment
      uses: actions/deploy-pages@v5
